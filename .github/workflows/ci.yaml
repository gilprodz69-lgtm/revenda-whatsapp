name: Build e testes
on: [push, pull_request]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10-bookworm
        env: { POSTGRES_PASSWORD: test_only, POSTGRES_DB: revenda_test }
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.6-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:test_only@localhost:5432/revenda_test
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22.22.0, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run test:runtime
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
        working-directory: apps/admin
      - run: npm run test:e2e -w apps/admin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: interface-diagnostico
          path: apps/admin/test-results/
          retention-days: 3
      - run: for script in scripts/*.sh infra/*.sh; do bash -n "$script"; done
      - run: bash scripts/test-installer.sh
      - run: node scripts/vps-command.cjs | bash -n
      - run: docker build -f apps/api/Dockerfile -t revenda-api:1.0.0 .
      - run: docker build -f apps/admin/Dockerfile -t revenda-admin:1.0.0 .
      - run: bash scripts/compose-smoke.sh
