name: ${COMPOSE_PROJECT_NAME:-revenda}
x-app: &app
  image: revenda-api:1.0.2
  build: { context: ., dockerfile: apps/api/Dockerfile }
  environment: &app-env
    NODE_ENV: ${NODE_ENV:-production}
    PORT: 3000
    TRUST_PROXY: ${TRUST_PROXY:-1}
    DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL}
    REDIS_URL: ${REDIS_URL:?Configure REDIS_URL}
    APP_ORIGIN: ${APP_ORIGIN:?Configure APP_ORIGIN}
    PUBLIC_API_URL: ${PUBLIC_API_URL:?Configure PUBLIC_API_URL}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Configure ENCRYPTION_KEY}
    WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Configure WEBHOOK_SECRET}
    EVOLUTION_URL: http://evolution:8080
    EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?Configure EVOLUTION_API_KEY}
    PARTNER_URL: ${PARTNER_URL:-https://ggsoma.store/api/partner/v1}
    PARTNER_API_KEY: ${PARTNER_API_KEY:-}
    PARTNER_REQUESTS_PER_MINUTE: ${PARTNER_REQUESTS_PER_MINUTE:-60}
    PARTNER_ORDERS_PER_MINUTE: ${PARTNER_ORDERS_PER_MINUTE:-10}
    PIX_GATEWAY: ${PIX_GATEWAY:-disabled}
    EXPAY_API_KEY: ${EXPAY_API_KEY:-}
    EXPAY_STORE_ID: ${EXPAY_STORE_ID:-}
    MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
    MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
  restart: unless-stopped
  init: true
  networks: [private, egress]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: ['/tmp:size=64m,mode=1777']
  mem_limit: 768m
  cpus: 1.0
  logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
services:
  postgres:
    image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD}
      EVOLUTION_DB_PASSWORD: ${EVOLUTION_DB_PASSWORD:?Configure EVOLUTION_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    networks: [private]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck:
      {
        test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d postgres'],
        interval: 10s,
        timeout: 5s,
        retries: 12,
      }
    mem_limit: 1g
    cpus: 1.0
    logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }
  redis:
    image: redis:7.4.6-alpine@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
    environment: { REDIS_PASSWORD: '${REDIS_PASSWORD:?Configure REDIS_PASSWORD}' }
    command:
      [
        sh,
        -c,
        'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy noeviction',
      ]
    volumes: [redis_data:/data]
    networks: [private]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck:
      {
        test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG'],
        interval: 10s,
        timeout: 5s,
        retries: 12,
      }
    mem_limit: 512m
    cpus: 0.5
  migrate:
    <<: *app
    command: [sh, -c, 'npm run db:migrate && node dist/bootstrap.js']
    environment:
      <<: *app-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Configure ADMIN_EMAIL}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      PARTNER_API_KEY_FILE: /run/secrets/partner_api_key
      EXPAY_API_KEY_FILE: /run/secrets/expay_api_key
    secrets: [admin_password, partner_api_key, expay_api_key]
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  api:
    <<: *app
    healthcheck:
      {
        test:
          [
            CMD,
            node,
            -e,
            'fetch("http://127.0.0.1:3000/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
          ],
        interval: 15s,
        timeout: 5s,
        start_period: 30s,
        retries: 12,
      }
  worker:
    <<: *app
    command: [node, dist/worker.js]
    stop_grace_period: 90s
    healthcheck:
      {
        test:
          [
            CMD,
            node,
            -e,
            'import("./dist/core/db.js").then(async({redis})=>{const v=await redis.get("worker:heartbeat");await redis.quit();process.exit(v?0:1)}).catch(()=>process.exit(1))',
          ],
        interval: 20s,
        timeout: 10s,
        start_period: 30s,
        retries: 6,
      }
  evolution:
    image: evoapicloud/evolution-api:v2.3.7@sha256:1bd8afc4a6cf48822e6cf02469aeae7bd35a12a6b616eacd1291926307f4d339
    entrypoint: [/bin/bash, /opt/revenda/evolution-entrypoint.sh]
    environment:
      SERVER_PORT: 8080
      SERVER_URL: http://evolution:8080
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: revenda
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Configure EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'false'
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: 'false'
      LOG_LEVEL: ERROR
      LOG_BAILEYS: fatal
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'
      DATABASE_SAVE_MESSAGE_UPDATE: 'false'
      DATABASE_SAVE_DATA_HISTORIC: 'false'
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      TELEMETRY_ENABLED: 'false'
    volumes:
      - evolution_instances:/evolution/instances
      - ./infra/evolution-entrypoint.sh:/opt/revenda/evolution-entrypoint.sh:ro
    networks: [private, egress]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1536m
    cpus: 1.0
    healthcheck:
      {
        test:
          [
            CMD,
            node,
            -e,
            'fetch("http://127.0.0.1:8080").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
          ],
        interval: 20s,
        timeout: 10s,
        start_period: 120s,
        retries: 12,
      }
    logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }
  admin:
    image: revenda-admin:1.0.2
    build: { context: ., dockerfile: apps/admin/Dockerfile }
    networks: [private]
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      {
        test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/health'],
        interval: 15s,
        timeout: 5s,
        retries: 6,
      }
  proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      {
        APP_DOMAIN: '${APP_DOMAIN:?Configure APP_DOMAIN}',
        ACME_EMAIL: '${ACME_EMAIL:?Configure ACME_EMAIL}',
      }
    ports: ['80:80', '443:443', '443:443/udp']
    volumes: [./infra/Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    networks: [private, egress]
    depends_on:
      api: { condition: service_healthy }
      admin: { condition: service_healthy }
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      {
        test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:2019/config/'],
        interval: 20s,
        timeout: 5s,
        retries: 6,
      }
networks:
  private: { internal: true }
  egress: {}
volumes:
  postgres_data: {}
  redis_data: {}
  evolution_instances: {}
  caddy_data: {}
  caddy_config: {}
secrets:
  admin_password: { file: ./secrets/admin-password }
  partner_api_key: { file: ./secrets/partner-api-key }
  expay_api_key: { file: ./secrets/expay-api-key }
